# whaletrail-lab watchlist for hourly/daily paper trading.
#
# Keep Yahoo symbols for the existing data path and add TradingView symbols for
# the tvscreener fallback/supplemental source.
items:
  - id: gold_futures
    name: 黄金期货
    yahoo_symbol: GC=F
    tv_symbol: COMEX:GC1!
    asset_class: futures
    exchange: COMEX
    tradable: true
    data_source_priority:
      - existing_api
      - tvscreener

